
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3efff;
            color: #29243a;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .app {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            background: #6c4ce3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>My To-Do List</h1>
        <p>Add your tasks and track your progress.</p>

        <form id="todo-form" class="input-row">
            <input type="text" id="task-input"
                   placeholder="Enter a task..." autocomplete="off">
            <button type="submit">Add Task</button>
        </form>

      <ul id="task-list"></ul>
        <p id="emptyMessage">No tasks yet. Add your first task!</p>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
